services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flc
      POSTGRES_PASSWORD: flc_dev_only
      POSTGRES_DB: flcdecor
    ports:
      - "5432:5432"
    volumes:
      - flc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flc -d flcdecor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flc_postgres_data:
